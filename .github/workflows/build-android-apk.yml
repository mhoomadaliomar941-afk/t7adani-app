name: Build Android APK (T7ADANI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Required for Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Capacitor Config
        run: |
          mkdir -p www
          if [ -f "dist/index.html" ]; then
            cp -r dist/* www/
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.t7adani.app",
            "appName": "تحدّاني - T7ADANI",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install Capacitor 6 & Generate Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: t7adani-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
